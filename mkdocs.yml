site_name: systemspec-pricingpackaging
site_description: A machine-readable description of a product's pricing and packaging
site_url: https://plexusone.github.io/systemspec-pricingpackaging
repo_url: https://github.com/plexusone/systemspec-pricingpackaging
repo_name: plexusone/systemspec-pricingpackaging

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Concepts: guides/index.md
      - Writing a spec: guides/writing-a-spec.md
      - Using a spec: guides/using-a-spec.md
  - Releases:
      - releases/index.md
      - v0.1.0: releases/v0.1.0.md
      - Changelog: releases/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/systemspec-pricingpackaging
